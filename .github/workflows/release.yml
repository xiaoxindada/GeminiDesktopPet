name: CI Build & Tag Release

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：发布指定的 GitHub Release Tag（例如 v0.2.0），留空时仅在 Tag Ref 下自动创建 Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches standalone VERSION file
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if (-not (Test-Path "VERSION")) {
            throw "Standalone VERSION file not found."
          }
          $ver = (Get-Content -Path "VERSION" -Raw -Encoding UTF8).Trim().TrimStart('v', 'V')
          $tagName = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_TAG)) { $env:INPUT_RELEASE_TAG.Trim() } else { $env:GITHUB_REF_NAME }
          if ("v$ver" -ne $tagName) {
            throw "Git tag ($tagName) does not match standalone VERSION file ($ver)."
          }
          Write-Host "Verified tag $tagName matches VERSION file ($ver)."

      - name: Restore and build Release
        shell: pwsh
        run: |
          dotnet restore GeminiDesktopPet.slnx
          dotnet build GeminiDesktopPet.slnx -c Release --no-restore

      - name: Run static security check
        shell: pwsh
        run: ./tools/SecurityCheck.ps1 -RepoRoot "."

      - name: Build self-contained Release package ZIP & Git commit summary
        shell: cmd
        run: BuildRelease.bat --nopause

      - name: Verify release ZIP and git commit summary
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "publish" -Filter "GeminiDesktopPet-v*.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Release ZIP archive was not generated in publish/."
          }
          if (-not (Test-Path "publish/git-commit-summary.md")) {
            throw "publish/git-commit-summary.md was not generated by BuildRelease.bat."
          }
          Write-Host ("Generated ZIP: {0} ({1} bytes)" -f $zip.FullName, $zip.Length)
          Write-Host "--- Git Commit Summary ---"
          Get-Content -Path "publish/git-commit-summary.md" -Encoding UTF8
          tar -tf $zip.FullName | Select-Object -First 25

      - name: Upload Release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeminiDesktopPet-${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}-win-x64
          path: |
            publish/GeminiDesktopPet-v*.zip
            publish/git-commit-summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Generate Changelog & Publish GitHub Tag Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if (-not [string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_TAG)) { $env:INPUT_RELEASE_TAG.Trim() } else { $env:GITHUB_REF_NAME }
          $zip = Get-ChildItem -Path "publish" -Filter "GeminiDesktopPet-v*.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Release ZIP archive not found."
          }

          $summaryPath = "publish/git-commit-summary.md"
          if (-not (Test-Path $summaryPath)) {
            throw "Git commit summary generated by BuildRelease.bat not found at $summaryPath."
          }
          $summaryText = (Get-Content -Path $summaryPath -Raw -Encoding UTF8).Trim()

          $ghGeneratedNotes = ""
          $ErrorActionPreference = 'Continue'
          $apiOutput = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$tag" -q ".body" 2>$null
          if ($LASTEXITCODE -eq 0 -and $apiOutput) {
            $ghGeneratedNotes = ($apiOutput | Out-String).Trim()
          }

          $notesSections = New-Object System.Collections.Generic.List[string]
          if (-not [string]::IsNullOrWhiteSpace($ghGeneratedNotes)) {
            $notesSections.Add($ghGeneratedNotes)
          }
          $notesSections.Add($summaryText)

          $changelogPath = "publish/release-changelog.md"
          [System.IO.File]::WriteAllText($changelogPath, ($notesSections -join "`n`n") + "`n", (New-Object System.Text.UTF8Encoding($false)))

          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'

          if ($releaseExists) {
            gh release upload $tag $zip.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE." }
            gh release edit $tag --title "GeminiDesktopPet $tag" --notes-file $changelogPath
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE." }
          } else {
            gh release create $tag $zip.FullName --title "GeminiDesktopPet $tag" --notes-file $changelogPath
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
          }
